Name: Trading Signal Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas requests numpy

      - name: All Strategies Parallel Run Karo
        run: |
          python coinglass_strategy.py live &
          python coinglass_multi.py live &
          python ebad_crypto_1.py live &
          python ebad_22.py live &
          wait

      - name: Alert states auto-save karo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update alert state JSONs"
          file_pattern: "*.json"
