name: Trading Signal Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas requests numpy

      - name: Strategy check chalao
        run: python coinglass_multi.py live

      - name: State save karo (duplicate alerts rokne ke liye)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add alert_state.json || true
          git diff --cached --quiet || git commit -m "update state"
          git push || true
