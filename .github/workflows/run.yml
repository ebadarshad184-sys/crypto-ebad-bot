name: Trading Signal Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas requests numpy

      - name: Strategy check chalao
        run: python coinglass_strategy.py live
